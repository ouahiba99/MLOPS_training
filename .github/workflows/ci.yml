name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt

      - name: Pull DVC artifacts from Azure
        env:
          AZURE_STORAGE_CONNECTION_STRING: >-
            DefaultEndpointsProtocol=https;AccountName=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }};AccountKey=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }};EndpointSuffix=core.windows.net
        run: dvc pull

      - name: Validate DVC metadata
        run: dvc status

      - name: Bootstrap MLflow model registry
        run: python -m scripts.log_to_mlflow

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t olist-late-delivery:${{ github.sha }} .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/olist-late-delivery:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/olist-late-delivery:latest
