name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-dev.txt

      - name: Pull DVC artifacts from Azure
        env:
          AZURE_STORAGE_CONNECTION_STRING: >-
            DefaultEndpointsProtocol=https;AccountName=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }};AccountKey=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }};EndpointSuffix=core.windows.net
        run: dvc pull

      - name: Validate DVC metadata
        run: dvc status

      - name: Verify model artifact
        run: |
          ls -lah models/artifacts/
          test -f models/artifacts/final_model.joblib

      - name: Initialize MLflow registry
        run: PYTHONPATH=. python scripts/log_to_mlflow.py

      - name: Verify MLflow registry
        run: |
          PYTHONPATH=. python - <<'PY'
          from src.model_registry import get_champion_version_info

          info = get_champion_version_info()

          print(f"MLflow champion: {info}")

          assert info["registered_model_name"] == "olist_late_delivery"
          assert info["alias"] == "champion"
          assert info["version"] == 1
          assert info["run_id"]
          PY

      - name: Verify MLflow runtime configuration
        run: |
          PYTHONPATH=. python - <<'PY'
          import mlflow
          import os

          print("MLFLOW_TRACKING_URI:", os.getenv("MLFLOW_TRACKING_URI"))
          print("MLflow tracking URI:", mlflow.get_tracking_uri())

          assert os.getenv("MLFLOW_TRACKING_URI") == "sqlite:///mlflow.db"
          assert mlflow.get_tracking_uri() == "sqlite:///mlflow.db"
          PY

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pre-commit
        run: pre-commit run --all-files

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t olist-late-delivery:${{ github.sha }} .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/olist-late-delivery:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/olist-late-delivery:latest
