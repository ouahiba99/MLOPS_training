services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MLflow tracking server + registry.
  # Postgres stores tracking/registry metadata.
  # MLflow artifacts are stored in the mlflow-artifacts volume.
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_USER}:${MLFLOW_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --artifacts-destination /mlartifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5001,127.0.0.1:5001
    ports:
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Registers the trained model in MLflow and assigns the champion alias.
  mlflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/log_to_mlflow.py"]
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  # FastAPI inference service.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    depends_on:
      mlflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus scrapes the API internally through the Docker Compose
  # service name api:8000. From the host browser, the API is available
  # at http://localhost:8000/metrics.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Tells Prometheus what its public-facing URL is so that links in the
      # web UI (e.g. target scrape URLs, alert annotations) resolve to
      # localhost:9090 rather than the internal container hostname/ID.
      - --web.external-url=http://localhost:9090
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy


  # Exports PostgreSQL internals (connections, locks, table stats, etc.)
  # for Prometheus scraping at port 9187 on the internal network.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    command:
      - "--no-collector.wal"
    depends_on:
      postgres:
        condition: service_healthy

  # Reads Nginx stub_status and converts it to Prometheus text format.
  # Prometheus scrapes this exporter at port 9113; the exporter itself
  # reads stub_status from the proxy container internally.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command:
      - --nginx.scrape-uri=http://proxy:8080/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      proxy:
        condition: service_started
  
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
         condition: service_healthy

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
