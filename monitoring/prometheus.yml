# Scrapes the API's /metrics endpoint (Task 3, item 10). Job name here
# must match what monitoring/alerts.yml's ServiceDown/ModelRegistryFallback
# rules query — "olist-api" — or those alerts silently never fire.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: olist-api
    static_configs:
      - targets: ["api:8000"]
