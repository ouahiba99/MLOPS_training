events {}

http {
    upstream api_backend {
        server api:8000;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Exposes Nginx connection/request counters for Prometheus scraping.
        # Access is restricted to the internal Docker Compose network only —
        # this path is not forwarded through to the API backend.
        location /nginx_status {
            stub_status on;
            allow 172.0.0.0/8;   # Docker internal networks
            allow 127.0.0.1;
            deny all;
        }
    }
}
